kind: VirtualService
apiVersion: networking.istio.io/v1beta1
metadata:
  namespace: default
  name: msvc-backend-bff
spec:
  hosts:
    - msvc-backend-bff.default.svc.cluster.local # The service DNS
  http:
    - route:
        - destination:
            host: msvc-backend-bff.default.svc.cluster.local
            subset: safe
          weight: 100
        - destination:
            host: msvc-backend-bff.default.svc.cluster.local
            subset: risky
          weight: 0
  
---
kind: DestinationRule
apiVersion: networking.istio.io/v1beta1
metadata:
  namespace: default
  name: msvc-backend-bff
spec:
  host: msvc-backend-bff.default.svc.cluster.local
  subsets:
    - name: safe
      labels:
        version: safe
    - name: risky
      labels:
        version: risky
---


