apiVersion: v1
kind: PersistentVolume
metadata:
  name: mockserver-pv
spec:
  capacity:
    storage: 100M
  accessModes:
    - ReadWriteOnce
  storageClassName: standard  
  hostPath:
    path: "/home/ingeniero/Documents/gitRepository/udemy/k6/project-final-kubernates-v001/shared/server-mock/"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mockserver-mocks-pv
spec:
  capacity:
    storage: 100M
  accessModes:
    - ReadWriteOnce
  storageClassName: standard  
  hostPath:
    path: "/home/ingeniero/Documents/gitRepository/udemy/k6/project-final-kubernates-v001/shared/server-mock/mocks"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mockserver-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100M
  storageClassName: standard  # Agregar storageClassName
  volumeName: mockserver-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mockserver-mocks-pv
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100M
  storageClassName: standard  # Agregar storageClassName
  volumeName: mockserver-mocks-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mockserver
  name: mockserver-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mockserver
  template:
    metadata:
      labels:
        app: mockserver
    spec:
      containers:
      - image: mocksserver/main
        name: mockserver
        ports:
        - containerPort: 3100
        - containerPort: 3110
        env:
          - name: MOCKS_PATH
            value: /input
        command: ["npm", "start"]
        volumeMounts:
        - name: mocks-volume-1
          mountPath: /input
        - name: mocks-volume-2
          mountPath: /input/mocks
      volumes:
        - name: mocks-volume-1
          persistentVolumeClaim:
            claimName: mockserver-pvc
        - name: mocks-volume-2
          persistentVolumeClaim:
            claimName: mockserver-mocks-pv
---
apiVersion: v1
kind: Service
metadata:
  name: mockserver
spec:
  ports:
  - name: http
    port: 3100
    protocol: TCP
    targetPort: 3100
  - name: https
    port: 3110
    protocol: TCP
    targetPort: 3110
  selector:
    app: mockserver
  type: LoadBalancer
